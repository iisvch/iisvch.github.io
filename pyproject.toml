[project]
name = "iisvch-github-io"
version = "0.0.1"
description = "Initial website for iigor GitHub"
authors = [
    {name = "IGOR",email = "iiasevych@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0.0,<2.3.0",
    "pandas>=3.0.5,<4.0.0",
    "matplotlib>=3.8.0,<3.11.0",
    "seaborn>=0.13.2,<0.14.0",
    "plotly>=7.0.0,<8.0.0",
]

[tool.poetry]
packages = [{include = "iisvch"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
