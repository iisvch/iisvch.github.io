project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - projects.qmd
    - cv.qmd
    - contact.qmd
    - projects/*.qmd
  resources:
    - CV.pdf
    - Canarsie/*.ipynb
    - Canarsie/*.pptx
    - Canarsie/*.docx
    - Canarsie/*.xlsx
    - assets/*
    - images/Ich_a.png
    - .nojekyll

website:
  title: "Igor Iasevych"
  site-url: https://iisvch.github.io
  description: "Strategy, finance, and applied analytics. A portfolio by Igor Iasevych, based in Boston."
  favicon: assets/favicon.svg
  navbar:
    title: "Igor Iasevych"
    background: "#223343"
    foreground: "#ffffff"
    collapse-below: lg
    left:
      - text: Home
        href: index.qmd
      - text: About Me
        href: about.qmd
      - text: Projects
        href: projects.qmd
      - text: CV
        href: cv.qmd
      - text: Contact
        href: contact.qmd
    right:
      - href: https://www.linkedin.com/in/igoriasevych/
        icon: linkedin
        aria-label: "Igor Iasevych on LinkedIn"
      - href: https://github.com/iisvch
        icon: github
        aria-label: "Igor Iasevych on GitHub"
  page-footer:
    left: "© 2026 Igor Iasevych"
    right: "Strategy · Finance · Analytics"
  search: false
  open-graph: true
  twitter-card: false

format:
  html:
    theme:
      - cosmo
      - styles.scss
    lang: en
    page-layout: full
    toc: false
    title-block-banner: false
    anchor-sections: false
    link-external-newwindow: false
    code-copy: true
    code-fold: true

execute:
  enabled: false
